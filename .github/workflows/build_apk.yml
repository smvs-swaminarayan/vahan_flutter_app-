name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradle executable
        run: chmod +x android/gradlew || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build_output.log

      - name: Report Build Error on Failure
        if: failure()
        run: |
          echo "## ❌ Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "### Last 120 lines of build log:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: STK-Vahan-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
